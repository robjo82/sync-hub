version: "3.8"

services:
  sync-hub-remote:
    image: registry.robin-joseph.fr/sync-hub/remote-hub:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "47213:4000"
    environment:
      HOST: "0.0.0.0"
      PORT: "4000"
      SYNC_HUB_DISABLE_LOCAL_INGEST: "1"
      SYNC_HUB_REMOTE_TOKEN: "REPLACE_WITH_A_REAL_SECRET"
      SYNC_HUB_DATA_DIR: /data
    volumes:
      - sync-hub-remote-data:/data

volumes:
  sync-hub-remote-data:
