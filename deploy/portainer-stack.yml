# Fichier prêt à coller dans Portainer (ou déployé via l'API Portainer).
#
# Rôle « hub distant » : c'est la même image que l'instance locale, avec le scan de fichiers
# désactivé — il n'y a rien à scanner dans le conteneur. Elle ne fait que recevoir les
# POST /api/sync/push des instances locales et les stocker.
#
# Le hub n'a plus de secret partagé : chaque machine s'authentifie avec son propre jeton
# d'appareil (table api_tokens), créé depuis le menu compte du dashboard. Un secret unique ne
# pouvait attribuer un push à personne, ni être révoqué pour une machine sans couper les autres.

services:
  remote-hub:
    image: registry.robin-joseph.fr/sync-hub/remote-hub:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "47213:4000"
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      SYNC_HUB_DATA_DIR: /data
      SYNC_HUB_DISABLE_LOCAL_INGEST: "1"
      # Connexion Google. Les quatre variables sont requises : s'il en manque une — et
      # SYNC_HUB_GOOGLE_ALLOWED_DOMAINS en particulier — le flux reste désactivé, ce qui est
      # voulu : sans restriction de domaine, « se connecter avec Google » vaut pour tout compte
      # Google existant. Voir docs/CONNEXION-GOOGLE.md.
      # Cloudflare Access - la voie recommandee : aucun secret ici, le tag AUD est public.
      # Voir docs/CONNEXION-CLOUDFLARE-ACCESS.md.
      SYNC_HUB_ACCESS_TEAM_DOMAIN: "robinjoseph.cloudflareaccess.com"
      SYNC_HUB_ACCESS_AUD: ""
      SYNC_HUB_ACCESS_ALLOWED_DOMAINS: "ekonum.fr"
      SYNC_HUB_GOOGLE_CLIENT_ID: ""
      SYNC_HUB_GOOGLE_CLIENT_SECRET: ""
      SYNC_HUB_GOOGLE_REDIRECT_URI: "https://sync-hub.robin-joseph.fr/api/auth/google/callback"
      SYNC_HUB_GOOGLE_ALLOWED_DOMAINS: "ekonum.fr"
    labels:
      # Watchtower tourne sur ce serveur en --label-enable : il ne met à jour que les conteneurs
      # qui le demandent explicitement. Avec ce label, un push sur main suffit — la CI pousse
      # l'image, Watchtower la récupère dans la minute et redéploie. Pas de webhook à gérer.
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - sync-hub-data:/data

volumes:
  sync-hub-data:
