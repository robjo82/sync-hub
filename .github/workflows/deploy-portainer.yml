name: Deploy remote hub

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.robin-joseph.fr/sync-hub/remote-hub:latest
            registry.robin-joseph.fr/sync-hub/remote-hub:${{ github.sha }}

      - name: Trigger Portainer redeploy
        if: ${{ secrets.PORTAINER_STACK_WEBHOOK_URL != '' }}
        run: curl -X POST "${{ secrets.PORTAINER_STACK_WEBHOOK_URL }}"
